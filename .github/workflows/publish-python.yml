name: Publish python image

# Builds the Python CGP from the 'python' branch, tests it and publishes it as
# 'pedbarbosa/cgp:python'. Then compares it with the PHP CGP's dev image, so
# a CGP change not yet ported shows up as a failure. Never touches 'latest',
# 'dev' or the dated tags.
on:
  push:
    branches: [python]
    paths-ignore:
      - "**.md"
      - docker-compose.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  IMAGE: pedbarbosa/cgp:python
  PHP_IMAGE: pedbarbosa/cgp:dev

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run the unit tests
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q

      - uses: docker/login-action@v4
        with:
          username: pedbarbosa
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the image
        run: |
          docker build --pull --no-cache \
            --build-arg REVISION="$GITHUB_SHA" \
            --label org.opencontainers.image.created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version=python \
            --tag "$IMAGE" .
          echo "Built '$IMAGE' at ${GITHUB_SHA:0:7}." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test the image
        run: ./test "$IMAGE"

      - name: Publish the image
        run: docker push "$IMAGE"

      # After publishing, so a CGP change that isn't ported yet doesn't hold
      # up the image, but still fails the run and reaches Slack
      - name: Compare with the PHP CGP
        run: |
          docker pull --quiet "$PHP_IMAGE"
          status=0
          output=$(tests/compare-with-php "$IMAGE" "$PHP_IMAGE" 2>&1) || status=$?
          echo "$output"
          { echo "### Comparison with '$PHP_IMAGE'"; echo '```'; tail -40 <<<"$output"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Send the failure to Slack
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL isn't set, failure not sent to Slack"
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg text ":x: $GITHUB_WORKFLOW failed for '$IMAGE': $run_url" '{text: $text}' \
            | curl -fsS --retry 3 -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
