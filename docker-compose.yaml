services:
  cgp:
    image: pedbarbosa/cgp:python
    container_name: cgp
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/lib/collectd/rrd:/var/lib/collectd/rrd:ro
      # optional: settings and extra plugin JSON files, see README.md
      # - ./cgp:/etc/cgp:ro
    ports:
      - 8085:80
    restart: unless-stopped
